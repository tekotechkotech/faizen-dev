services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE:-faizen}
      MARIADB_USER: ${DB_USERNAME:-faizen}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: FaizenStudio
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?set APP_URL}
      APP_KEY: ${APP_KEY:?set APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-faizen}
      DB_USERNAME: ${DB_USERNAME:-faizen}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - backend-storage:/var/www/storage

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
      HOST: 0.0.0.0
      PORT: "3010"
    command: ["sh", "-c", "bun run build && bun run preview --host 0.0.0.0 --port 3010"]
    ports:
      - "3010:3010"

volumes:
  db-data:
  backend-storage:
