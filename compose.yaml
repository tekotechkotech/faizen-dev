services:
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      - PUBLIC_API_URL=http://backend:8000/api
    depends_on: [backend]
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env.example
    depends_on: [db]
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: faizen
      MARIADB_USER: faizen
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: rootsecret
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dbdata:/var/lib/mysql
    ports: ["3306:3306"]
volumes:
  dbdata: {}
